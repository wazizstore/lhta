  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WAZIZ SHOP | المتجر الرسمي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ── Header ── -->
  <header class="site-header">
    <div class="nav-inner">
      <div style="width:40px;"></div>
      <a href="index.html" class="nav-logo"> SHOP<span>WAZIZ</span></a>
      <button class="icon-btn" onclick="toggleCart()" aria-label="سلة التسوق">
        <i class="fas fa-shopping-bag"></i>
        <span class="badge" id="cartBadge">0</span>
      </button>
    </div>
  </header>

  <!-- ── Hero ── -->
  <section class="hero">
    <img src="brand_hero_bg.webp" alt="waziz shop" loading="eager">
    <div class="hero-content">
      <h1 class="hero-title"></h1>
      <button class="btn-primary" onclick="window.location.href='shop.html'">
        <i class="fas fa-shopping-bag"></i>
        تسوق الآن
      </button>
    </div>
  </section>

  <!-- ── Featured Products ── -->
  <section class="section">
    <h2 class="section-title">أحدث الموديلات</h2>
    <div class="grid" id="featuredGrid"></div>
  </section>

  <!-- ── Footer ── -->
  <footer class="site-footer">
    <div class="footer-logo">WAZIZ <span>SHOP</span></div>
    <p class="footer-tagline">أناقة مغربية بلمسة عالمية.</p>
    <p class="footer-copy">© 2026 waziz shop — جميع الحقوق محفوظة</p>
  </footer>

  <!-- ── Cart Drawer ── -->
  <div class="drawer-overlay" id="cartOverlay" onclick="toggleCart()"></div>
  <div class="drawer" id="cartDrawer">
    <div class="drawer-header">
      <span class="drawer-title"><i class="fas fa-shopping-bag"></i> سلة التسوق</span>
      <button class="icon-btn" onclick="toggleCart()"><i class="fas fa-times"></i></button>
    </div>
    <div class="drawer-body" id="cartBody"></div>
    <div class="drawer-footer" id="cartFoot" style="display:none">
      <div class="cart-total-row">
        <span>المجموع:</span>
        <span class="cart-total-amount" id="cartTotal">0 درهم</span>
      </div>
      <button class="submit-btn" onclick="window.location.href='shop.html'">
        <i class="fas fa-check-circle"></i>
        إتمام الطلب
      </button>
    </div>
  </div>

  <!-- ── WhatsApp ── -->
  <a href="https://wa.me/212604971625" class="whatsapp-float" target="_blank" aria-label="تواصل واتساب">
    <i class="fab fa-whatsapp"></i>
  </a>

  <script src="shared_data.js"></script>
  <script>
    let cart = JSON.parse(sessionStorage.getItem('wz_cart') || '[]');

    function updateBadge() {
      document.getElementById('cartBadge').textContent = cart.length;
    }

    function toggleCart() {
      document.getElementById('cartDrawer').classList.toggle('open');
      document.getElementById('cartOverlay').classList.toggle('open');
      renderCart();
    }

    function renderCart() {
      const body = document.getElementById('cartBody');
      const foot = document.getElementById('cartFoot');
      if (!cart.length) {
        body.innerHTML = `<div class="cart-empty"><i class="fas fa-shopping-bag"></i>السلة فارغة</div>`;
        foot.style.display = 'none';
        return;
      }
      let total = 0;
      body.innerHTML = cart.map((item, idx) => {
        total += parseInt(item.price);
        return `
          <div class="cart-item">
            <img src="${item.img}" alt="${item.name}">
            <div class="cart-item-info">
              <div class="cart-item-name">${item.name}</div>
              ${(item.color || item.size) ? `<div class="cart-item-meta">${[item.color, item.size].filter(Boolean).join(' · ')}</div>` : ''}
              <div class="cart-item-price">${item.price} درهم</div>
            </div>
            <button class="cart-item-remove" onclick="rmCart(${idx})"><i class="fas fa-trash-alt"></i></button>
          </div>
        `;
      }).join('');
      document.getElementById('cartTotal').textContent = total + ' درهم';
      foot.style.display = 'block';
    }

    function rmCart(idx) {
      cart.splice(idx, 1);
      sessionStorage.setItem('wz_cart', JSON.stringify(cart));
      updateBadge();
      renderCart();
    }

    function renderFeatured() {
      const grid = document.getElementById('featuredGrid');
      grid.innerHTML = products.map((p, i) => {
        const disc = Math.round((1 - p.price / p.originalPrice) * 100);
        return `
          <div class="pcard reveal" style="animation-delay:${i * 0.07}s" onclick="window.location.href='product.html?id=${p.id}'">
            <div class="pcard-img">
              <img src="${p.images[0]}" alt="${p.name}" loading="lazy">
              ${disc > 0 ? `<span class="pcard-badge">-${disc}%</span>` : ''}
            </div>
            <div class="pcard-body">
              <div class="pcard-name">${p.name}</div>
              <div class="pcard-price">
                <span class="price-now">${p.price} درهم</span>
                <span class="price-old">${p.originalPrice} درهم</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    document.addEventListener('DOMContentLoaded', () => {
      updateBadge();
      renderFeatured();
    });
  </script>
</body>
</html>
