<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المتجر | lhta morocco</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <!-- Preload critical images for faster display -->
    <link rel="preload" as="image" href="lhta.webp">
</head>
<body>

    <header class="site-header">
        <div class="nav-inner">
            <button class="icon-btn" onclick="window.location.href='index.html'"><i class="fas fa-home"></i></button>
            <a href="index.html" class="nav-logo"><img src="lhta.webp" alt="lhta morocco"></a>
            <button class="icon-btn" onclick="toggleCart()">
                <i class="fas fa-shopping-bag"></i>
                <span class="badge" id="cartBadge">0</span>
            </button>
        </div>
    </header>

    <section class="section">
        <h2 class="section-title">جميع المنتجات</h2>
        <div class="grid" id="shopGrid"></div>
    </section>

    <div class="drawer-overlay" id="cartOverlay" onclick="toggleCart()"></div>
    <div class="drawer" id="cartDrawer">
        <div class="drawer-header">
            <span style="font-weight: 800; color: var(--accent);">سلة التسوق</span>
            <button class="icon-btn" onclick="toggleCart()"><i class="fas fa-times"></i></button>
        </div>
        <div class="drawer-body" id="cartBody"></div>
        <div class="drawer-footer" id="cartFoot" style="display:none">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px; font-weight:800;">
                <span>المجموع:</span>
                <span id="cartTotal" style="color: var(--accent);">0 درهم</span>
            </div>
            <button class="submit-btn" onclick="openCheckout()">إتمام الطلب</button>
        </div>
    </div>

    <div class="drawer-overlay" id="coOverlay" onclick="closeCheckout()"></div>
    <div class="drawer" id="coDrawer" style="left:auto; right:-100%;">
        <div class="drawer-header">
            <span style="font-weight: 800; color: var(--accent);">تأكيد الطلب</span>
            <button class="icon-btn" onclick="closeCheckout()"><i class="fas fa-times"></i></button>
        </div>
        <div class="drawer-body" id="coBody">
            <div class="order-card" style="margin-top:0">
                <div class="form-field"><label>الاسم الكامل</label><input type="text" id="cName"></div>
                <div class="form-field"><label>رقم الهاتف</label><input type="tel" id="cPhone"></div>
                <div class="form-field"><label>المدينة</label><input type="text" id="cCity"></div>
                <div class="form-field"><label>العنوان</label><textarea id="cAddr"></textarea></div>
                <button class="submit-btn" id="cartSubmitBtn" onclick="submitCart()">تأكيد الطلب الآن</button>
            </div>
        </div>
    </div>

    <div id="toast" style="position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:var(--accent); color:#000; padding:10px 20px; border-radius:50px; font-size:13px; font-weight:800; display:none; z-index:3000; box-shadow: 0 5px 15px rgba(0,0,0,0.3);"></div>

    <script src="shared_data.js"></script>
    <script>
        let cart = JSON.parse(sessionStorage.getItem('wz_cart') || '[]');
        const TG_TOKEN='8387473741:AAGHOI-oS7HXYFPSKfBmzotZ2PGCGNxhJiU', TG_CHAT='6781508116';

        async function tg(msg) {
            try {
                const r=await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:TG_CHAT,text:msg})});
                return r.ok;
            } catch(e) { return false; }
        }

        function updateBadge() {
            document.getElementById('cartBadge').textContent = cart.length;
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        function renderShop() {
            const grid = document.getElementById('shopGrid');
            grid.innerHTML = products.map(p => {
                const disc = Math.round((1 - p.price / p.originalPrice) * 100);
                return `
                    <div class="pcard reveal" onclick="window.location.href='product.html?id=${p.id}'">
                        <div class="pcard-img">
                            <img src="${p.images[0]}" alt="${p.name}" loading="lazy">
                            ${disc > 0 ? `<span class="pcard-badge">-${disc}%</span>` : ''}
                        </div>
                        <div class="pcard-body">
                            <div class="pcard-name">${p.name}</div>
                            <div class="pcard-price">
                                <span class="price-now">${p.price} درهم</span>
                                <span class="price-old">${p.originalPrice} درهم</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleCart() {
            document.getElementById('cartDrawer').classList.toggle('open');
            document.getElementById('cartOverlay').classList.toggle('open');
            renderCart();
        }

        function renderCart() {
            const body = document.getElementById('cartBody');
            const foot = document.getElementById('cartFoot');
            if (!cart.length) {
                body.innerHTML = '<p style="text-align:center; padding:40px; opacity:0.3; font-size:14px;">السلة فارغة</p>';
                foot.style.display = 'none';
                return;
            }
            let total = 0;
            body.innerHTML = cart.map((item, idx) => {
                total += parseInt(item.price);
                return `
                    <div style="display:flex; gap:12px; margin-bottom:15px; align-items:center; background:#111; padding:10px; border-radius:8px;">
                        <img src="${item.img}" style="width:50px; height:50px; object-fit:cover; border-radius:4px;">
                        <div style="flex:1">
                            <div style="font-weight:700; font-size:13px;">${item.name}</div>
                            <div style="font-size:11px; color:var(--text-muted);">${item.color} · ${item.size}</div>
                            <div style="font-weight:800; color:var(--accent); font-size:14px;">${item.price} د</div>
                        </div>
                        <button onclick="rmCart(${idx})" style="background:none; border:none; color:#ff4757; cursor:pointer;"><i class="fas fa-trash-alt"></i></button>
                    </div>
                `;
            }).join('');
            document.getElementById('cartTotal').textContent = total + ' درهم';
            foot.style.display = 'block';
        }

        function rmCart(idx) {
            cart.splice(idx, 1);
            sessionStorage.setItem('wz_cart', JSON.stringify(cart));
            updateBadge();
            renderCart();
        }

        function openCheckout() {
            document.getElementById('coDrawer').style.right = '0';
            document.getElementById('coOverlay').classList.add('open');
        }

        function closeCheckout() {
            document.getElementById('coDrawer').style.right = '-100%';
            document.getElementById('coOverlay').classList.remove('open');
        }

        async function submitCart() {
            const name=document.getElementById('cName').value.trim(), phone=document.getElementById('cPhone').value.trim(), city=document.getElementById('cCity').value.trim(), addr=document.getElementById('cAddr').value.trim();
            if(!name||!phone||!city||!addr){showToast('يرجى ملء جميع الحقول');return;}
            
            let msg=`🛒 طلب من السلة\n👤 ${name}\n📱 ${phone}\n🏙️ ${city}\n📍 ${addr}\n\n📋 المنتجات:\n`, total=0;
            cart.forEach((i,idx)=>{total+=parseInt(i.price);msg+=`${idx+1}. ${i.name} · ${i.color} · ${i.size} · ${i.price} درهم\n`;});
            msg+=`\n💰 المجموع: ${total} درهم`;
            
            const btn=document.getElementById('cartSubmitBtn');
            btn.disabled=true; btn.innerHTML='جاري الإرسال... <span class="spinner"></span>';
            
            if(await tg(msg)){
                document.getElementById('coBody').innerHTML=`<div class="success-box"><div class="suc-ico"><i class="fas fa-check-circle"></i></div><h3>تم استلام طلبك بنجاح!</h3><p>شكراً ${name}، سنتصل بك قريباً.</p></div>`;
                cart=[]; sessionStorage.setItem('wz_cart', JSON.stringify(cart)); updateBadge();
            } else {
                showToast('حدث خطأ، حاول مرة أخرى');
                btn.disabled=false; btn.textContent='تأكيد الطلب الآن';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateBadge();
            renderShop();
        });
    </script>
</body>
</html>
