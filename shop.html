<html lang="ar" dir="rtl">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المتجر | WAZIZ SHOP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ── Header ── -->
  <header class="site-header">
    <div class="nav-inner">
      <button class="icon-btn" onclick="window.location.href='index.html'" aria-label="الرئيسية">
        <i class="fas fa-arrow-right"></i>
      </button>
      <a href="index.html" class="nav-logo">WAZIZ <span>SHOP</span></a>
      <button class="icon-btn" onclick="toggleCart()" aria-label="سلة التسوق">
        <i class="fas fa-shopping-bag"></i>
        <span class="badge" id="cartBadge">0</span>
      </button>
    </div>
  </header>

  <!-- ── Products ── -->
  <section class="section">
    <h2 class="section-title">جميع المنتجات</h2>
    <div class="grid" id="shopGrid"></div>
  </section>

  <!-- ── Toast ── -->
  <div id="toast"></div>

  <!-- ── Cart Drawer ── -->
  <div class="drawer-overlay" id="cartOverlay" onclick="toggleCart()"></div>
  <div class="drawer" id="cartDrawer">
    <div class="drawer-header">
      <span class="drawer-title"><i class="fas fa-shopping-bag"></i> سلة التسوق</span>
      <button class="icon-btn" onclick="toggleCart()"><i class="fas fa-times"></i></button>
    </div>
    <div class="drawer-body" id="cartBody"></div>
    <div class="drawer-footer" id="cartFoot" style="display:none">
      <div class="cart-total-row">
        <span>المجموع:</span>
        <span class="cart-total-amount" id="cartTotal">0 درهم</span>
      </div>
      <button class="submit-btn" onclick="openCheckout()">
        <i class="fas fa-check-circle"></i>
        إتمام الطلب
      </button>
    </div>
  </div>

  <!-- ── Checkout Drawer ── -->
  <div class="drawer-overlay" id="coOverlay" onclick="closeCheckout()"></div>
  <div class="co-drawer" id="coDrawer">
    <div class="drawer-header">
      <span class="drawer-title"><i class="fas fa-map-marker-alt"></i> تأكيد الطلب</span>
      <button class="icon-btn" onclick="closeCheckout()"><i class="fas fa-times"></i></button>
    </div>
    <div class="drawer-body" id="coBody">
      <div class="order-section" style="margin-top:0; border:none; background:transparent;">
        <div class="order-section-body" style="padding:0;">
          <div class="form-field"><label>الاسم الكامل</label><input type="text" id="cName" placeholder="اسمك الكامل"></div>
          <div class="form-field"><label>رقم الهاتف</label><input type="tel" id="cPhone" placeholder="06XXXXXXXX"></div>
          <div class="form-field"><label>المدينة</label><input type="text" id="cCity" placeholder="مدينتك"></div>
          <div class="form-field"><label>العنوان التفصيلي</label><textarea id="cAddr" placeholder="الحي، الشارع..."></textarea></div>
          <button class="submit-btn" id="cartSubmitBtn" onclick="submitCart()">
            <i class="fas fa-paper-plane"></i>
            تأكيد الطلب الآن
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="shared_data.js"></script>
  <script>
    let cart = JSON.parse(sessionStorage.getItem('wz_cart') || '[]');
    const TG_TOKEN = '8387473741:AAGHOI-oS7HXYFPSKfBmzotZ2PGCGNxhJiU';
    const TG_CHAT  = '6781508116';

    async function tg(msg) {
      try {
        const r = await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: TG_CHAT, text: msg })
        });
        return r.ok;
      } catch (e) { return false; }
    }

    function updateBadge() {
      document.getElementById('cartBadge').textContent = cart.length;
    }

    function showToast(msg, type = '') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = type;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 3000);
    }

    function renderShop() {
      const grid = document.getElementById('shopGrid');
      grid.innerHTML = products.map((p, i) => {
        const disc = Math.round((1 - p.price / p.originalPrice) * 100);
        return `
          <div class="pcard reveal" style="animation-delay:${i * 0.07}s" onclick="window.location.href='product.html?id=${p.id}'">
            <div class="pcard-img">
              <img src="${p.images[0]}" alt="${p.name}" loading="lazy">
              ${disc > 0 ? `<span class="pcard-badge">-${disc}%</span>` : ''}
            </div>
            <div class="pcard-body">
              <div class="pcard-name">${p.name}</div>
              <div class="pcard-price">
                <span class="price-now">${p.price} درهم</span>
                <span class="price-old">${p.originalPrice} درهم</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleCart() {
      document.getElementById('cartDrawer').classList.toggle('open');
      document.getElementById('cartOverlay').classList.toggle('open');
      renderCart();
    }

    function renderCart() {
      const body = document.getElementById('cartBody');
      const foot = document.getElementById('cartFoot');
      if (!cart.length) {
        body.innerHTML = `<div class="cart-empty"><i class="fas fa-shopping-bag"></i>السلة فارغة</div>`;
        foot.style.display = 'none';
        return;
      }
      let total = 0;
      body.innerHTML = cart.map((item, idx) => {
        total += parseInt(item.price);
        return `
          <div class="cart-item">
            <img src="${item.img}" alt="${item.name}">
            <div class="cart-item-info">
              <div class="cart-item-name">${item.name}</div>
              ${(item.color || item.size) ? `<div class="cart-item-meta">${[item.color, item.size].filter(Boolean).join(' · ')}</div>` : ''}
              <div class="cart-item-price">${item.price} درهم</div>
            </div>
            <button class="cart-item-remove" onclick="rmCart(${idx})"><i class="fas fa-trash-alt"></i></button>
          </div>
        `;
      }).join('');
      document.getElementById('cartTotal').textContent = total + ' درهم';
      foot.style.display = 'block';
    }

    function rmCart(idx) {
      cart.splice(idx, 1);
      sessionStorage.setItem('wz_cart', JSON.stringify(cart));
      updateBadge();
      renderCart();
    }

    function openCheckout() {
      document.getElementById('coDrawer').classList.add('open');
      document.getElementById('coOverlay').classList.add('open');
    }

    function closeCheckout() {
      document.getElementById('coDrawer').classList.remove('open');
      document.getElementById('coOverlay').classList.remove('open');
    }

    async function submitCart() {
      const name  = document.getElementById('cName').value.trim();
      const phone = document.getElementById('cPhone').value.trim();
      const city  = document.getElementById('cCity').value.trim();
      const addr  = document.getElementById('cAddr').value.trim();

      if (!name || !phone || !city || !addr) {
        showToast('يرجى ملء جميع الحقول', 'error');
        return;
      }

      let msg = `🛒 طلب من السلة\n👤 ${name}\n📱 ${phone}\n🏙️ ${city}\n📍 ${addr}\n\n📋 المنتجات:\n`;
      let total = 0;
      cart.forEach((item, idx) => {
        total += parseInt(item.price);
        const variants = [item.color, item.size].filter(Boolean).join(' · ');
        msg += `${idx + 1}. ${item.name}${variants ? ' · ' + variants : ''} · ${item.price} درهم\n`;
      });
      msg += `\n💰 المجموع: ${total} درهم`;

      const btn = document.getElementById('cartSubmitBtn');
      btn.disabled = true;
      btn.innerHTML = 'جاري الإرسال... <span class="spinner"></span>';

      if (await tg(msg)) {
        document.getElementById('coBody').innerHTML = `
          <div class="success-box">
            <div class="suc-ico"><i class="fas fa-check-circle"></i></div>
            <h3>تم استلام طلبك بنجاح!</h3>
            <p>شكراً ${name}، سنتصل بك قريباً لتأكيد طلبك.</p>
          </div>
        `;
        cart = [];
        sessionStorage.setItem('wz_cart', JSON.stringify(cart));
        updateBadge();
      } else {
        showToast('حدث خطأ، حاول مرة أخرى', 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-paper-plane"></i> تأكيد الطلب الآن';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      updateBadge();
      renderShop();
    });
  </script>
</body>
</html>
