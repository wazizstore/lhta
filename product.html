<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المنتج | WAZIZ SHOP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ── Header ── -->
  <header class="site-header">
    <div class="nav-inner">
      <button class="icon-btn" onclick="history.back()" aria-label="رجوع">
        <i class="fas fa-arrow-right"></i>
      </button>
      <a href="index.html" class="nav-logo">WAZIZ <span>SHOP</span></a>
      <button class="icon-btn" onclick="toggleCart()" aria-label="سلة التسوق">
        <i class="fas fa-shopping-bag"></i>
        <span class="badge" id="cartBadge">0</span>
      </button>
    </div>
  </header>

  <!-- ── Product Content ── -->
  <div class="product-page" id="productPage">
    <div style="text-align:center; padding:60px 20px; color:var(--text-muted);">
      <i class="fas fa-spinner fa-spin" style="font-size:28px;"></i>
    </div>
  </div>

  <!-- ── Toast ── -->
  <div id="toast"></div>

  <!-- ── Cart Drawer ── -->
  <div class="drawer-overlay" id="cartOverlay" onclick="toggleCart()"></div>
  <div class="drawer" id="cartDrawer">
    <div class="drawer-header">
      <span class="drawer-title"><i class="fas fa-shopping-bag"></i> سلة التسوق</span>
      <button class="icon-btn" onclick="toggleCart()"><i class="fas fa-times"></i></button>
    </div>
    <div class="drawer-body" id="cartBody"></div>
    <div class="drawer-footer" id="cartFoot" style="display:none">
      <div class="cart-total-row">
        <span>المجموع:</span>
        <span class="cart-total-amount" id="cartTotal">0 درهم</span>
      </div>
      <button class="submit-btn" onclick="openCheckout()">
        <i class="fas fa-check-circle"></i>
        إتمام الطلب
      </button>
    </div>
  </div>

  <!-- ── Checkout Drawer ── -->
  <div class="drawer-overlay" id="coOverlay" onclick="closeCheckout()"></div>
  <div class="co-drawer" id="coDrawer">
    <div class="drawer-header">
      <span class="drawer-title"><i class="fas fa-map-marker-alt"></i> تأكيد الطلب</span>
      <button class="icon-btn" onclick="closeCheckout()"><i class="fas fa-times"></i></button>
    </div>
    <div class="drawer-body" id="coBody">
      <div id="coForm">
        <div class="form-field"><label>الاسم الكامل</label><input type="text" id="cName" placeholder="اسمك الكامل"></div>
        <div class="form-field"><label>رقم الهاتف</label><input type="tel" id="cPhone" placeholder="06XXXXXXXX"></div>
        <div class="form-field"><label>المدينة</label><input type="text" id="cCity" placeholder="مدينتك"></div>
        <div class="form-field"><label>العنوان التفصيلي</label><textarea id="cAddr" placeholder="الحي، الشارع..."></textarea></div>
        <button class="submit-btn" id="coSubmitBtn" onclick="submitOrder()">
          <i class="fas fa-paper-plane"></i>
          تأكيد الطلب الآن
        </button>
      </div>
    </div>
  </div>

  <!-- ── WhatsApp ── -->
  <a href="https://wa.me/212604971625" class="whatsapp-float" target="_blank" aria-label="واتساب">
    <i class="fab fa-whatsapp"></i>
  </a>

  <script src="shared_data.js"></script>
  <script>
    // ── Cart ──────────────────────────────────────────────────────
    let cart = JSON.parse(sessionStorage.getItem('wz_cart') || '[]');
    const TG_TOKEN = '8387473741:AAGHOI-oS7HXYFPSKfBmzotZ2PGCGNxhJiU';
    const TG_CHAT  = '6781508116';

    // Current product & selections
    let currentProduct = null;
    let selectedColor   = null;
    let selectedSize    = null;

    // ─── Telegram ──────────────────────────────────────────────
    async function tg(msg) {
      try {
        const r = await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: TG_CHAT, text: msg })
        });
        return r.ok;
      } catch (e) { return false; }
    }

    // ─── Toast ─────────────────────────────────────────────────
    function showToast(msg, type = '') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = type;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 3000);
    }

    // ─── Badge ─────────────────────────────────────────────────
    function updateBadge() {
      document.getElementById('cartBadge').textContent = cart.length;
    }

    // ─── Cart Drawer ───────────────────────────────────────────
    function toggleCart() {
      document.getElementById('cartDrawer').classList.toggle('open');
      document.getElementById('cartOverlay').classList.toggle('open');
      renderCart();
    }

    function renderCart() {
      const body = document.getElementById('cartBody');
      const foot = document.getElementById('cartFoot');
      if (!cart.length) {
        body.innerHTML = `<div class="cart-empty"><i class="fas fa-shopping-bag"></i>السلة فارغة</div>`;
        foot.style.display = 'none';
        return;
      }
      let total = 0;
      body.innerHTML = cart.map((item, idx) => {
        total += parseInt(item.price);
        return `
          <div class="cart-item">
            <img src="${item.img}" alt="${item.name}">
            <div class="cart-item-info">
              <div class="cart-item-name">${item.name}</div>
              ${(item.color || item.size) ? `<div class="cart-item-meta">${[item.color, item.size].filter(Boolean).join(' · ')}</div>` : ''}
              <div class="cart-item-price">${item.price} درهم</div>
            </div>
            <button class="cart-item-remove" onclick="rmCart(${idx})"><i class="fas fa-trash-alt"></i></button>
          </div>
        `;
      }).join('');
      document.getElementById('cartTotal').textContent = total + ' درهم';
      foot.style.display = 'block';
    }

    function rmCart(idx) {
      cart.splice(idx, 1);
      sessionStorage.setItem('wz_cart', JSON.stringify(cart));
      updateBadge();
      renderCart();
    }

    // ─── Checkout Drawer ───────────────────────────────────────
    function openCheckout() {
      document.getElementById('coDrawer').classList.add('open');
      document.getElementById('coOverlay').classList.add('open');
    }

    function closeCheckout() {
      document.getElementById('coDrawer').classList.remove('open');
      document.getElementById('coOverlay').classList.remove('open');
    }

    // ─── Variant Selection ─────────────────────────────────────
    function selectColor(colorName, el) {
      selectedColor = colorName;
      document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
      el.classList.add('active');
    }

    function selectSize(size, el) {
      selectedSize = size;
      document.querySelectorAll('.chip.size-chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
    }

    // ─── Validate Selections ───────────────────────────────────
    function validateSelections() {
      const p = currentProduct;
      const hasColors = p.colors && p.colors.length > 0;
      const hasSizes  = p.sizes  && p.sizes.length  > 0;
      if (hasColors && !selectedColor) {
        showToast('الرجاء اختيار اللون', 'error');
        return false;
      }
      if (hasSizes && !selectedSize) {
        showToast('الرجاء اختيار المقاس', 'error');
        return false;
      }
      return true;
    }

    // ─── Add to Cart ───────────────────────────────────────────
    function addToCart() {
      if (!validateSelections()) return;
      const p = currentProduct;
      cart.push({
        id:    p.id,
        name:  p.name,
        price: p.price,
        img:   p.images[0],
        color: selectedColor || '',
        size:  selectedSize  || ''
      });
      sessionStorage.setItem('wz_cart', JSON.stringify(cart));
      updateBadge();
      showToast('تمت الإضافة إلى السلة ✓', 'success');
    }

    // ─── Buy Now ───────────────────────────────────────────────
    function buyNow() {
      if (!validateSelections()) return;
      const p = currentProduct;
      // Pre-fill a single item in checkout
      window._buyNowItem = {
        id:    p.id,
        name:  p.name,
        price: p.price,
        img:   p.images[0],
        color: selectedColor || '',
        size:  selectedSize  || ''
      };
      openCheckout();
    }

    // ─── Submit Order (Buy Now or Cart) ────────────────────────
    async function submitOrder() {
      const name  = document.getElementById('cName').value.trim();
      const phone = document.getElementById('cPhone').value.trim();
      const city  = document.getElementById('cCity').value.trim();
      const addr  = document.getElementById('cAddr').value.trim();

      if (!name || !phone || !city || !addr) {
        showToast('يرجى ملء جميع الحقول', 'error');
        return;
      }

      // Determine items: buy-now single OR full cart
      let items = window._buyNowItem ? [window._buyNowItem] : cart;
      if (!items.length) {
        showToast('السلة فارغة', 'error');
        return;
      }

      let msg = `🛒 طلب جديد\n👤 ${name}\n📱 ${phone}\n🏙️ ${city}\n📍 ${addr}\n\n📋 المنتجات:\n`;
      let total = 0;
      items.forEach((item, idx) => {
        total += parseInt(item.price);
        const variants = [item.color, item.size].filter(Boolean).join(' · ');
        msg += `${idx + 1}. ${item.name}${variants ? ' · ' + variants : ''} · ${item.price} درهم\n`;
      });
      msg += `\n💰 المجموع: ${total} درهم`;

      const btn = document.getElementById('coSubmitBtn');
      btn.disabled = true;
      btn.innerHTML = 'جاري الإرسال... <span class="spinner"></span>';

      if (await tg(msg)) {
        document.getElementById('coBody').innerHTML = `
          <div class="success-box">
            <div class="suc-ico"><i class="fas fa-check-circle"></i></div>
            <h3>تم استلام طلبك بنجاح!</h3>
            <p>شكراً ${name}، سنتصل بك قريباً لتأكيد طلبك.</p>
          </div>
        `;
        // Clear cart if it was a cart order
        if (!window._buyNowItem) {
          cart = [];
          sessionStorage.setItem('wz_cart', JSON.stringify(cart));
          updateBadge();
        }
        window._buyNowItem = null;
      } else {
        showToast('حدث خطأ، حاول مرة أخرى', 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-paper-plane"></i> تأكيد الطلب الآن';
      }
    }

    // ─── Gallery ───────────────────────────────────────────────
    function switchImage(src, thumbEl) {
      const main = document.getElementById('mainImg');
      main.style.opacity = '0';
      setTimeout(() => {
        main.src = src;
        main.style.opacity = '1';
      }, 150);
      document.querySelectorAll('.thumb-img').forEach(t => t.classList.remove('active'));
      thumbEl.classList.add('active');
    }

    // ─── Render Product Page ────────────────────────────────────
    function renderProduct() {
      const params = new URLSearchParams(window.location.search);
      const id = parseInt(params.get('id'));
      const p  = products.find(x => x.id === id);

      if (!p) {
        document.getElementById('productPage').innerHTML = `
          <div style="text-align:center;padding:80px 20px;color:var(--text-muted);">
            <i class="fas fa-exclamation-circle" style="font-size:40px;margin-bottom:16px;display:block;"></i>
            المنتج غير موجود
            <br><br>
            <button class="btn-primary" onclick="window.location.href='shop.html'" style="display:inline-flex;">
              العودة للمتجر
            </button>
          </div>
        `;
        return;
      }

      currentProduct = p;
      document.title = `${p.name} | WAZIZ SHOP`;

      // Helpers
      const hasColors = p.colors && p.colors.length > 0;
      const hasSizes  = p.sizes  && p.sizes.length  > 0;
      const hasVariants = hasColors || hasSizes;
      const disc = Math.round((1 - p.price / p.originalPrice) * 100);

      // ── Gallery HTML ──────────────────────────────────────
      const galleryHtml = `
        <div class="product-gallery">
          <div class="main-img-wrap">
            <img id="mainImg" class="main-img" src="${p.images[0]}" alt="${p.name}">
          </div>
          ${p.images.length > 1 ? `
            <div class="thumb-grid">
              ${p.images.map((img, i) => `
                <img
                  class="thumb-img ${i === 0 ? 'active' : ''}"
                  src="${img}"
                  alt="${p.name} ${i + 1}"
                  loading="lazy"
                  onclick="switchImage('${img}', this)"
                >
              `).join('')}
            </div>
          ` : ''}
        </div>
      `;

      // ── Discount badge ────────────────────────────────────
      const discountHtml = disc > 0 ? `<span class="discount-tag">-${disc}% تخفيض</span>` : '';

      // ── Colors (only if product has colors) ───────────────
      const colorsHtml = hasColors ? `
        <div class="option-group">
          <span class="option-label"><i class="fas fa-palette"></i> اللون</span>
          <div class="color-swatch-group">
            ${p.colors.map(c => `
              <div
                class="color-swatch ${c.class}${!c.inStock ? ' out-of-stock' : ''}"
                title="${c.name}${!c.inStock ? ' (غير متوفر)' : ''}"
                onclick="${c.inStock ? `selectColor('${c.name}', this)` : ''}"
              >
                <span class="color-name-tooltip">${c.name}</span>
              </div>
            `).join('')}
          </div>
        </div>
      ` : '';

      // ── Sizes (only if product has sizes) ─────────────────
      const sizesHtml = hasSizes ? `
        <div class="option-group">
          <span class="option-label"><i class="fas fa-ruler"></i> المقاس</span>
          <div class="chips">
            ${p.sizes.map(s => `
              <button class="chip size-chip" onclick="selectSize('${s}', this)">${s}</button>
            `).join('')}
          </div>
          ${p.showSizeGuide ? `
            <div class="size-hint">
              <i class="fas fa-info-circle"></i>
              <span>M مناسب 65–75كغ · L مناسب 75–85كغ · XL مناسب 85–95كغ</span>
            </div>
          ` : ''}
        </div>
      ` : '';

      // ── CTA buttons ───────────────────────────────────────
      const ctaHtml = `
        <div class="cta-group">
          <button class="btn-buy-now" onclick="buyNow()">
            <i class="fas fa-bolt"></i>
            اطلب الآن
          </button>
          <button class="btn-add-cart" onclick="addToCart()">
            <i class="fas fa-shopping-bag"></i>
            أضف إلى السلة
          </button>
        </div>
      `;

      // ── Info block ────────────────────────────────────────
      const infoHtml = `
        <div class="product-info">
          <h1 class="product-name">${p.name}</h1>
          <div class="product-prices">
            <span class="product-price-now">${p.price} درهم</span>
            ${disc > 0 ? `<span class="product-price-old">${p.originalPrice} درهم</span>` : ''}
            ${discountHtml}
          </div>
          <p class="product-desc">${p.description}</p>

          ${colorsHtml}
          ${sizesHtml}
          ${ctaHtml}
        </div>
      `;

      // ── Assemble ──────────────────────────────────────────
      document.getElementById('productPage').innerHTML = `
        <div class="product-layout">
          ${galleryHtml}
          ${infoHtml}
        </div>
      `;
    }

    document.addEventListener('DOMContentLoaded', () => {
      updateBadge();
      renderProduct();
    });
  </script>
</body>
</html>
